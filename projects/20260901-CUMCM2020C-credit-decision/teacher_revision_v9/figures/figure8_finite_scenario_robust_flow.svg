<text x="1175.0" y="55" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#17375E" text-anchor="middle"><tspan x="1175.0" dy="0">脆弱性驱动的有限情景稳健配置</tspan></text><text x="1175.0" y="98" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#5B6B7D" text-anchor="middle"><tspan x="1175.0" dy="0">以压力测试刻画下行边界；不将三类情景误作连续不确定集或概率分布</tspan></text>
