<rect x="645" y="555" width="440" height="175" rx="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="865.0" y="613" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="865.0" dy="0">风险与留存双通道</tspan></text><text x="865.0" y="667" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="865.0" dy="0">qᵢ,s = min{1, qᵢ + δₛVᵢ}</tspan><tspan x="865.0" dy="28.6">retᵢ(r,s) = retᵢ(r)(1−γₛVᵢ)</tspan></text>
