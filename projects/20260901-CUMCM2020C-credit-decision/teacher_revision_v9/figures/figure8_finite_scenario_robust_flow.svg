<rect x="100" y="555" width="420" height="155" rx="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="310.0" y="613" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="310.0" dy="0">百分位与主观权重</tspan></text><text x="310.0" y="667" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="310.0" dy="0">标准化后求加权平均</tspan><tspan x="310.0" dy="28.6">得到企业脆弱性 Vᵢ</tspan></text>
