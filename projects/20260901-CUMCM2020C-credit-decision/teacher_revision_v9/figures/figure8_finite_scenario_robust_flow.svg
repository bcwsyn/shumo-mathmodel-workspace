<rect x="1210" y="285" width="450" height="160" rx="28" fill="#E68430" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="1435.0" y="343" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">统一的授信变量</tspan></text><text x="1435.0" y="397" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">额度 xᵢ、利率 r、</tspan><tspan x="1435.0" dy="28.6">准入与预算约束</tspan></text>
