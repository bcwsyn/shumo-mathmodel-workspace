<rect x="1785" y="285" width="465" height="160" rx="28" fill="#17375E" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="2017.5" y="343" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="2017.5" dy="0">有限情景最大最小</tspan></text><text x="2017.5" y="397" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="2017.5" dy="0">max  minₛ Πₛ(x, r)</tspan><tspan x="2017.5" dy="28.6">选择最坏情景收益最大的方案</tspan></text>
<rect x="1785" y="555" width="465" height="175" rx="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="2017.5" y="613" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="2017.5" dy="0">可行性优先</tspan></text><text x="2017.5" y="667" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="2017.5" dy="0">原风险上限不可行时，</tspan><tspan x="2017.5" dy="28.6">先报告最小可行风险阈值</tspan></text>
