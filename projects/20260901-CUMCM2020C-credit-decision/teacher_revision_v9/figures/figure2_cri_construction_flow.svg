<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1070" viewBox="0 0 2350 1070">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2E73B9"/></marker><filter id="s"><feDropShadow dx="5" dy="7" stdDeviation="5" flood-color="#9BAABA" flood-opacity=".36"/></filter></defs>
<rect width="100%" height="100%" fill="white"/><rect width="100%" height="118" fill="#EEF4FA"/><rect y="112" width="100%" height="6" fill="#E68430"/>
<text x="1175.0" y="55" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#17375E" text-anchor="middle"><tspan x="1175.0" dy="0">信用评价与 CRI 构造流程</tspan></text><text x="1175.0" y="98" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#5B6B7D" text-anchor="middle"><tspan x="1175.0" dy="0">分类器输出被严格解释为评级概率；本文不将其标注为已校准违约概率</tspan></text>
<rect x="110" y="330" width="380" height="170" rx="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="300.0" y="388" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="300.0" dy="0">32 维发票经营特征</tspan></text><text x="300.0" y="442" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="300.0" dy="0">销项、进项、作废率、</tspan><tspan x="300.0" dy="28.6">集中度与时间结构</tspan></text>
<rect x="110" y="590" width="380" height="170" rx="28" fill="#DCEAF8" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="300.0" y="648" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="300.0" dy="0">预处理与标准化</tspan></text><text x="300.0" y="702" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="300.0" dy="0">缺失、异常、尺度口径</tspan><tspan x="300.0" dy="28.6">仅由训练折拟合</tspan></text>
<rect x="610" y="295" width="480" height="160" rx="28" fill="#17375E" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="850.0" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="850.0" dy="0">Logistic</tspan></text><text x="850.0" y="407" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="850.0" dy="0">线性、可解释的基分类器</tspan></text>
<rect x="610" y="570" width="480" height="160" rx="28" fill="#168C8C" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="850.0" y="628" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="850.0" dy="0">XGBoost</tspan></text><text x="850.0" y="682" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="850.0" dy="0">非线性补充分类器</tspan></text>
<rect x="1210" y="310" width="450" height="165" rx="28" fill="#E68430" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="1435.0" y="368" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">等级概率融合</tspan></text><text x="1435.0" y="422" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">w · p_Logistic + (1−w) · p_XGBoost</tspan><tspan x="1435.0" dy="28.6">w = 0.80</tspan></text>
<rect x="1210" y="575" width="450" height="165" rx="28" fill="#17375E" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="1435.0" y="633" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">保序映射 CRI</tspan></text><text x="1435.0" y="687" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="1435.0" dy="0">评级概率 → [0, 1]</tspan><tspan x="1435.0" dy="28.6">CRI 越高，信用越好</tspan></text>
<rect x="1780" y="300" width="460" height="175" rx="28" fill="#7658A5" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="2010.0" y="358" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="2010.0" dy="0">可报告结论</tspan></text><text x="2010.0" y="412" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="2010.0" dy="0">AUC、F1、Kappa 与</tspan><tspan x="2010.0" dy="28.6">风险方向一致性</tspan></text>
<rect x="1780" y="575" width="460" height="185" rx="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" filter="url(#s)"/><text x="2010.0" y="633" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#17324D" text-anchor="middle"><tspan x="2010.0" dy="0">不得过度解释</tspan></text><text x="2010.0" y="687" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#17324D" text-anchor="middle"><tspan x="2010.0" dy="0">未做违约率校准；不能宣称</tspan><tspan x="2010.0" dy="28.6">PD 置信区间、覆盖率或</tspan><tspan x="2010.0" dy="28.6">Bootstrap 上界</tspan></text>
